<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Separator Tool</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 48px;
        }
        
        h1 {
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            color: #1d1d1f;
        }
        
        .description {
            font-size: 1.125rem;
            color: #6e6e73;
            max-width: 720px;
            margin: 0 auto;
            font-weight: 400;
        }
        
        .input-section {
            background: #ffffff;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            margin-bottom: 32px;
        }
        
        textarea {
            width: 100%;
            height: 200px;
            padding: 16px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 1rem;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            resize: vertical;
            margin-bottom: 20px;
            transition: border-color 0.2s ease;
            background: #fbfbfd;
        }
        
        textarea:focus {
            outline: none;
            border-color: #0071e3;
            background: #ffffff;
        }
        
        textarea::placeholder {
            color: #86868b;
        }
        
        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 980px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s ease;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .process-btn {
            background: #0071e3;
            color: white;
        }
        
        .process-btn:hover {
            background: #0077ed;
        }
        
        .clear-btn {
            background: #e8e8ed;
            color: #1d1d1f;
        }
        
        .clear-btn:hover {
            background: #d2d2d7;
        }
        
        .results-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }
        
        .result-box {
            background: #ffffff;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f5f5f7;
        }
        
        .result-title {
            font-size: 1.375rem;
            font-weight: 600;
            color: #1d1d1f;
            letter-spacing: -0.01em;
        }
        
        .result-actions {
            display: flex;
            gap: 8px;
        }
        
        .copy-btn, .clear-result-btn {
            padding: 8px 16px;
            font-size: 0.875rem;
        }
        
        .copy-btn {
            background: #34c759;
            color: white;
        }
        
        .copy-btn:hover {
            background: #30b350;
        }
        
        .copy-btn.copied {
            background: #30b350;
        }
        
        .clear-result-btn {
            background: #ff3b30;
            color: white;
        }
        
        .clear-result-btn:hover {
            background: #ff453a;
        }
        
        .result-content {
            height: 320px;
            overflow-y: auto;
            padding: 16px;
            border: 1px solid #f5f5f7;
            border-radius: 12px;
            background: #fbfbfd;
            white-space: pre-line;
            font-size: 0.9375rem;
            line-height: 1.6;
            color: #1d1d1f;
        }
        
        .result-content::-webkit-scrollbar {
            width: 8px;
        }
        
        .result-content::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .result-content::-webkit-scrollbar-thumb {
            background: #d2d2d7;
            border-radius: 4px;
        }
        
        .result-content::-webkit-scrollbar-thumb:hover {
            background: #b4b4b9;
        }
        
        .count {
            margin-top: 12px;
            font-size: 0.9375rem;
            color: #6e6e73;
            text-align: right;
            font-weight: 500;
        }
        
        .empty-state {
            color: #86868b;
            font-style: italic;
        }
        
        footer {
            text-align: center;
            margin-top: 48px;
            color: #6e6e73;
            font-size: 0.875rem;
        }
        
        .error-message {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            color: #856404;
            display: none;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .description {
                font-size: 1rem;
            }
            
            .results-section {
                grid-template-columns: 1fr;
            }
            
            .result-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            
            .buttons {
                flex-direction: column;
                width: 100%;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ID Separator Tool</h1>
        </header>
        
        <section class="input-section">
            <div id="errorMessage" class="error-message"></div>
            <textarea id="inputData" placeholder="Paste your data here..." aria-label="Input data"></textarea>
            <div class="buttons">
                <button id="processBtn" class="process-btn">Process Data</button>
                <button id="clearBtn" class="clear-btn">Clear All</button>
            </div>
        </section>
        
        <section class="results-section">
            <div class="result-box">
                <div class="result-header">
                    <div class="result-title">New IDS</div>
                    <div class="result-actions">
                        <button class="copy-btn" data-target="ids615" aria-label="Copy 615 IDs">Copy</button>
                        <button class="clear-result-btn" data-target="ids615" aria-label="Clear 615 IDs">Clear</button>
                    </div>
                </div>
                <div id="ids615" class="result-content empty-state">No data processed yet</div>
                <div class="count">Total: <span id="count615">0</span></div>
            </div>
            
            <div class="result-box">
                <div class="result-header">
                    <div class="result-title">OLD IDs</div>
                    <div class="result-actions">
                        <button class="copy-btn" data-target="ids1000" aria-label="Copy 1000 IDs">Copy</button>
                        <button class="clear-result-btn" data-target="ids1000" aria-label="Clear 1000 IDs">Clear</button>
                    </div>
                </div>
                <div id="ids1000" class="result-content empty-state">No data processed yet</div>
                <div class="count">Total: <span id="count1000">0</span></div>
            </div>
        </section>
        
        <footer>
            <p>ID Separator Tool · Devoloped By NILL</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputData = document.getElementById('inputData');
            const processBtn = document.getElementById('processBtn');
            const clearBtn = document.getElementById('clearBtn');
            const ids615 = document.getElementById('ids615');
            const ids1000 = document.getElementById('ids1000');
            const count615 = document.getElementById('count615');
            const count1000 = document.getElementById('count1000');
            const errorMessage = document.getElementById('errorMessage');
            processBtn.addEventListener('click', processData);
            inputData.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    processData();
                }
            });
            clearBtn.addEventListener('click', function() {
                if (inputData.value || ids615.textContent || ids1000.textContent) {
                    if (confirm('Are you sure you want to clear all data?')) {
                        clearAll();
                    }
                }
            });
            document.querySelectorAll('.copy-btn').forEach(button => {
                button.addEventListener('click', async function() {
                    const targetId = this.getAttribute('data-target');
                    const content = document.getElementById(targetId).textContent;
                    
                    if (!content || content === 'No data processed yet') {
                        showError('No data to copy');
                        return;
                    }
                    
                    try {
                        await copyToClipboard(content);
                        const originalText = this.textContent;
                        this.classList.add('copied');
                        this.textContent = 'Copied!';
                        setTimeout(() => {
                            this.textContent = originalText;
                            this.classList.remove('copied');
                        }, 2000);
                    } catch (err) {
                        showError('Failed to copy to clipboard');
                    }
                });
            });
            document.querySelectorAll('.clear-result-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const element = document.getElementById(targetId);
                    
                    if (element.textContent && element.textContent !== 'No data processed yet') {
                        element.textContent = 'No data processed yet';
                        element.classList.add('empty-state');
                        if (targetId === 'ids615') {
                            count615.textContent = '0';
                        } else {
                            count1000.textContent = '0';
                        }
                    }
                });
            });
            
            function processData() {
                hideError();
                const data = inputData.value.trim();
                
                if (!data) {
                    showError('Please enter some data to process');
                    return;
                }
                
                const lines = data.split('\n').filter(line => line.trim() !== '');
                
                if (lines.length === 0) {
                    showError('No valid data found');
                    return;
                }
                
                const ids615Array = [];
                const ids1000Array = [];
                
                lines.forEach(line => {
                    const trimmedLine = line.trim();
                    if (!trimmedLine) return;
                    const parts = trimmedLine.split('|');
                    const idPart = parts[0].trim();
                    
                    if (idPart.startsWith('615')) {
                        ids615Array.push(trimmedLine);
                    } else if (idPart.startsWith('1000')) {
                        ids1000Array.push(trimmedLine);
                    }
                });
                
                // Display the results
                if (ids615Array.length > 0) {
                    ids615.textContent = ids615Array.join('\n');
                    ids615.classList.remove('empty-state');
                } else {
                    ids615.textContent = 'No IDs found starting with 615';
                    ids615.classList.add('empty-state');
                }
                
                if (ids1000Array.length > 0) {
                    ids1000.textContent = ids1000Array.join('\n');
                    ids1000.classList.remove('empty-state');
                } else {
                    ids1000.textContent = 'No IDs found starting with 1000';
                    ids1000.classList.add('empty-state');
                }
                count615.textContent = ids615Array.length;
                count1000.textContent = ids1000Array.length;
                if (ids615Array.length === 0 && ids1000Array.length === 0) {
                    showError('No IDs found matching the criteria (615 or 1000)');
                }
            }
            
            function clearAll() {
                inputData.value = '';
                ids615.textContent = 'No data processed yet';
                ids1000.textContent = 'No data processed yet';
                ids615.classList.add('empty-state');
                ids1000.classList.add('empty-state');
                count615.textContent = '0';
                count1000.textContent = '0';
                hideError();
            }
            
            async function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                }
            }
            
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                setTimeout(hideError, 5000);
            }
            
            function hideError() {
                errorMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
